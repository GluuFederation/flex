name: "Ops: Regenerate chart READMEs"

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - "!charts/**/README.md"
  workflow_dispatch:

concurrency:
  group: chart-readmes
  cancel-in-progress: true

permissions:
  contents: read

env:
  HELM_DOCS_VERSION: "1.14.2"

jobs:
  generate:
    name: Regenerate and open a pull request
    if: github.repository == 'GluuFederation/flex'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.MOWORKFLOWTOKEN }}

      - name: Install helm-docs
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          curl -fsSL -o helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf helm-docs.tar.gz helm-docs
          install -m 0755 helm-docs /usr/local/bin/helm-docs
          helm-docs --version

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.MOAUTO_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MOAUTO_GPG_PRIVATE_KEY_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure Git
        run: |
          git config --global user.name "mo-auto"
          git config --global user.email "54212639+mo-auto@users.noreply.github.com"
          git config --global user.signingkey "${{ steps.import_gpg.outputs.keyid }}"

      - name: Regenerate
        run: helm-docs ./charts/ --skip-version-footer

      - name: Open a pull request
        id: pr
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.MOWORKFLOWTOKEN }}
          branch: bot/chart-readmes
          base: main
          commit-message: "docs(charts): regenerate the chart READMEs"
          title: "docs(charts): regenerate the chart READMEs"
          body: |
            `helm-docs` regenerated the chart READMEs from `values.yaml`. The install guides link
            to these files at the release tag, and Artifact Hub renders them, so merge before
            cutting a release.
          sign-commits: true
          delete-branch: true
          add-paths: charts/**/README.md

      - name: Say what happened
        run: |
          if [[ -n "${{ steps.pr.outputs.pull-request-number }}" ]]; then
            echo "Opened #${{ steps.pr.outputs.pull-request-number }}"
          else
            echo "The chart READMEs are already current; nothing to open."
          fi
