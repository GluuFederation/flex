name: "Ops: Generate cloud-native docs"

# Regenerates docs/reference/kubernetes/helm-chart.md from the charts and opens a pull request.
#
# Split out of the retired build-docs.yml: this is the one part of it whose output is a published
# page rather than a build of the documentation host that has been switched off.
#
# It runs on a chart change rather than on a release. Previously it ran *after* a release
# was published, so the generated page landed on main only once the tag had already been cut --
# meaning every tag carried the previous release's version of it, including the tags gluu.org
# imports from.

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - "automation/docs/generated-cn-docs.sh"
  workflow_dispatch:

concurrency:
  group: generate-cn-docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: Regenerate and open a pull request
    if: github.repository == 'GluuFederation/flex'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.MOWORKFLOWTOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.MOAUTO_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MOAUTO_GPG_PRIVATE_KEY_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure Git
        run: |
          git config --global user.name "mo-auto"
          git config --global user.email "54212639+mo-auto@users.noreply.github.com"
          git config --global user.signingkey "${{ steps.import_gpg.outputs.keyid }}"

      - name: Regenerate
        run: bash ./automation/docs/generated-cn-docs.sh .

      - name: Open a pull request
        id: pr
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.MOWORKFLOWTOKEN }}
          branch: bot/cn-generated-docs
          base: main
          commit-message: "docs(reference): regenerate the cloud-native reference"
          title: "docs(reference): regenerate the cloud-native reference"
          body: |
            `automation/docs/generated-cn-docs.sh` regenerated the cloud-native reference from the
            charts. Merge before cutting a release, so the tag carries the current version of it.
          sign-commits: true
          delete-branch: true
          add-paths: docs/reference/**

      - name: Say what happened
        run: |
          if [[ -n "${{ steps.pr.outputs.pull-request-number }}" ]]; then
            echo "Opened #${{ steps.pr.outputs.pull-request-number }}"
          else
            echo "The generated reference is already current; nothing to open."
          fi
