name: "Release: Bump & Tag"

# Manually cut a release WITHOUT ever committing the version bump to main.
#
# Mechanism: check out the source ref (main), bump every Flex-owned version in
# the working tree, commit on a DETACHED HEAD (no branch ref is created), tag that
# commit `v<version>`, and push ONLY the tag. main is byte-for-byte untouched --
# the bumped tree exists solely under the tag. Pushing the `v**` tag triggers
# build-packages.yml, which builds the docker/package artifacts from the fully
# bumped tagged tree.
#
# Those builds download admin-ui-v<version>-built.tar.gz from the release, so the
# asset is built first: the bump commit is parked on refs/release-staging/v<version>
# (not a branch or tag, so nothing triggers), build-admin-ui.yml builds it, the
# asset is attached to a draft release, and only then is the tag pushed and the
# release published.
#
# The bump is validated (automation/release/version_bump.py --verify) BEFORE the
# commit, so a missed version aborts the run before any tag is pushed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (flex), e.g. 6.2.0 (no leading v)'
        required: true
      ref:
        description: 'Source ref to release from'
        required: false
        default: 'main'
      dry_run:
        description: 'Bump + verify only; do not commit, tag, or push'
        type: boolean
        default: false
      docker_suffix:
        description: 'Image-tag suffix (image tags become X.Y.Z-<suffix>)'
        required: false
        default: '1'
      jans_version:
        description: 'Jans version to release against, e.g. 2.5.0. Empty = derived (flex major - 4).'
        required: false
        default: ''

permissions:
  contents: read   # the tag push + release use MOWORKFLOWTOKEN, not GITHUB_TOKEN

concurrency:
  group: release-trigger-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'GluuFederation/flex'
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
      with:
        egress-policy: audit

    - name: Validate version input
      # Pass the input via env (not inline ${{ }}) so a value containing quotes can't break
      # out of the shell command -- this step runs before any validation.
      env:
        VERSION_INPUT: ${{ github.event.inputs.version }}
        SUFFIX_INPUT: ${{ github.event.inputs.docker_suffix }}
        JANS_INPUT: ${{ github.event.inputs.jans_version }}
      run: |
        V="$VERSION_INPUT"
        if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "::error::version must be X.Y.Z (optionally -suffix)"
          exit 1
        fi
        if [[ ! "$SUFFIX_INPUT" =~ ^[0-9A-Za-z.]+$ ]]; then
          echo "::error::docker_suffix must be alphanumeric (got '$SUFFIX_INPUT')"
          exit 1
        fi
        if [[ -n "$JANS_INPUT" && ! "$JANS_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "::error::jans_version must be X.Y.Z (optionally -suffix)"
          exit 1
        fi

    # Full history so the tag's commit has a real parent. The PAT is what makes
    # the later tag push trigger downstream workflows (GITHUB_TOKEN-pushed tags do not).
    - name: Checkout source ref
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ github.event.inputs.ref }}
        fetch-depth: 0
        # Do NOT persist a token in .git/config: the bump step runs version_bump.py from
        # the (possibly untrusted) ref before any push, so checked-out code must not be
        # able to read the PAT. The tag push below supplies the PAT explicitly.
        persist-credentials: false

    - name: Refuse if tag already exists
      run: |
        if git ls-remote --tags origin "refs/tags/v${{ github.event.inputs.version }}" | grep -q .; then
          echo "::error::tag v${{ github.event.inputs.version }} already exists on origin"
          exit 1
        fi

    # Detached HEAD guarantees no branch pointer can move: commits advance only HEAD.
    - name: Detach HEAD
      run: git checkout --detach

    - name: Bump every owned version in the working tree
      env:
        VERSION: ${{ github.event.inputs.version }}
        DOCKER_SUFFIX: ${{ github.event.inputs.docker_suffix }}
        JANS_VERSION: ${{ github.event.inputs.jans_version }}
      run: |
        # --flex-source-sha pins FLEX_SOURCE_VERSION to the released commit (HEAD here is the
        # source ref, before the bump commit); version_bump also pins JANS_SOURCE_VERSION to the
        # jans release's value.
        python3 automation/release/version_bump.py "${VERSION}" \
          --docker-suffix "${DOCKER_SUFFIX}" \
          --flex-source-sha "$(git rev-parse HEAD)" \
          ${JANS_VERSION:+--jans-version "${JANS_VERSION}"}

    # Safety net: abort BEFORE committing/pushing if any owned version was missed.
    - name: Verify the tree is fully bumped
      run: python3 automation/release/version_bump.py "${{ github.event.inputs.version }}" --verify

    - name: Assert HEAD is detached
      run: |
        if git symbolic-ref -q HEAD >/dev/null; then
          echo "::error::HEAD is on a branch -- refusing to proceed (would risk committing to a branch)"
          exit 1
        fi

    - name: Commit the bump (detached)
      id: commit
      if: ${{ github.event.inputs.dry_run != 'true' }}
      run: |
        git config user.name "gluu-flex-release-bot"
        git config user.email "mo@gluu.org"
        git add -A
        git commit -m "release: v${{ github.event.inputs.version }}"
        SHA="$(git rev-parse HEAD)"
        echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

    - name: Park the bump commit on a staging ref (main is never pushed)
      if: ${{ github.event.inputs.dry_run != 'true' }}
      env:
        GH_PAT: ${{ secrets.MOWORKFLOWTOKEN }}
        VERSION: ${{ github.event.inputs.version }}
      run: |
        # Checkout did not persist the PAT, so supply it here via a one-off authenticated URL.
        git symbolic-ref -q HEAD >/dev/null && { echo "::error::HEAD not detached"; exit 1; }
        git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
          "HEAD:refs/release-staging/v${VERSION}"

    - name: Summary
      if: always()
      # Pass inputs through env (ref is unvalidated) and emit with printf, so a value
      # containing backticks / $() cannot trigger command substitution.
      env:
        VERSION: ${{ github.event.inputs.version }}
        REF: ${{ github.event.inputs.ref }}
        DRY_RUN: ${{ github.event.inputs.dry_run }}
      run: |
        {
          printf '## Release v%s\n\n' "${VERSION}"
          printf -- '- Source ref: `%s`\n' "${REF}"
          printf -- '- Dry run: `%s`\n' "${DRY_RUN}"
          if [[ "${DRY_RUN}" == "true" ]]; then
            printf -- '- Bumped + verified only; no tag pushed.\n'
          else
            printf -- '- Parked the bump on `refs/release-staging/v%s`; jobs below build admin-ui, then tag + publish.\n' "${VERSION}"
            printf -- '- `main` was not modified.\n'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

  admin-ui:
    needs: bump
    if: ${{ github.event.inputs.dry_run != 'true' }}
    uses: ./.github/workflows/build-admin-ui.yml
    permissions:
      contents: read
    with:
      build_ref: ${{ needs.bump.outputs.sha }}
      version_name: v${{ github.event.inputs.version }}
      run_tests: true
      publish: 'false'
      deploy: 'false'

  tag:
    needs: [bump, admin-ui]
    runs-on: ubuntu-22.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
      with:
        egress-policy: audit

    - name: Checkout the bump commit
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ needs.bump.outputs.sha }}
        persist-credentials: false

    - name: Download admin-ui assets
      uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
      with:
        pattern: admin-ui-*
        merge-multiple: true
        path: admin-ui-assets

    - name: Create the draft GitHub Release with the admin-ui assets
      env:
        GH_TOKEN: ${{ secrets.MOWORKFLOWTOKEN }}
        VERSION: ${{ github.event.inputs.version }}
        SHA: ${{ needs.bump.outputs.sha }}
      run: |
        gh release create "v${VERSION}" \
          --repo "${GITHUB_REPOSITORY}" \
          --draft \
          --title "v${VERSION}" \
          --target "${SHA}" \
          --generate-notes \
          "admin-ui-assets/admin-ui-v${VERSION}-built.tar.gz" \
          "admin-ui-assets/admin-ui-v${VERSION}-node_modules.tar.gz"

    - name: Push ONLY the tag (main is never pushed)
      env:
        GH_PAT: ${{ secrets.MOWORKFLOWTOKEN }}
        VERSION: ${{ github.event.inputs.version }}
      run: |
        git config user.name "gluu-flex-release-bot"
        git config user.email "mo@gluu.org"
        git tag -a "v${VERSION}" -m "Gluu Flex v${VERSION}"
        git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
          "refs/tags/v${VERSION}"

    - name: Publish the GitHub Release
      env:
        GH_TOKEN: ${{ secrets.MOWORKFLOWTOKEN }}
        VERSION: ${{ github.event.inputs.version }}
      run: gh release edit "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false

  cleanup:
    needs: [bump, admin-ui, tag]
    if: ${{ always() && needs.bump.outputs.sha != '' }}
    runs-on: ubuntu-22.04
    steps:
    - name: Delete the failed draft release
      if: ${{ needs.tag.result == 'failure' }}
      env:
        GH_TOKEN: ${{ secrets.MOWORKFLOWTOKEN }}
        VERSION: ${{ github.event.inputs.version }}
      run: |
        IS_DRAFT=$(gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --json isDraft -q .isDraft 2>/dev/null || echo "")
        if [[ "${IS_DRAFT}" != "true" ]]; then
          echo "No draft release v${VERSION} to delete."
          exit 0
        fi
        if git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${VERSION}" | grep -q .; then
          echo "::warning::tag v${VERSION} was pushed; keeping draft release for manual publish."
          exit 0
        fi
        gh release delete "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --yes

    - name: Delete the staging ref
      env:
        GH_PAT: ${{ secrets.MOWORKFLOWTOKEN }}
        VERSION: ${{ github.event.inputs.version }}
      run: |
        git init -q staging && cd staging
        git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
          ":refs/release-staging/v${VERSION}"
