{{- $fullName := include "gateway-api.fullname" . -}}
{{- $namespace := .Release.Namespace -}}
{{- $defaultGatewayName := .Values.gateway.name -}}
{{- $defaultGatewayNamespace := .Values.routes.gatewayNamespace | default $namespace -}}
{{- $httpSection := .Values.routes.httpSectionName | default "http" -}}
{{- $httpsSection := .Values.routes.httpsSectionName | default "https" -}}
{{- $adminSvc := index .Values.global "admin-ui" "adminUiServiceName" -}}
{{- $authSvc := index .Values.global "auth-server" "authServerServiceName" -}}
{{- $configSvc := index .Values.global "config-api" "configApiServerServiceName" -}}
{{- $fido2Svc := .Values.global.fido2.fido2ServiceName -}}
{{- $scimSvc := .Values.global.scim.scimServiceName -}}
{{- $casaSvc := .Values.global.casa.casaServiceName -}}
{{- $adminUiGatewayName := index .Values.global "admin-ui" "gatewayName" | default $defaultGatewayName -}}
{{- $adminUiGatewayNamespace := index .Values.global "admin-ui" "gatewayNamespace" | default $defaultGatewayNamespace -}}
{{- $authGatewayName := index .Values.global "auth-server" "gatewayName" | default $defaultGatewayName -}}
{{- $authGatewayNamespace := index .Values.global "auth-server" "gatewayNamespace" | default $defaultGatewayNamespace -}}
{{- $casaGatewayName := .Values.global.casa.gatewayName | default $defaultGatewayName -}}
{{- $casaGatewayNamespace := .Values.global.casa.gatewayNamespace | default $defaultGatewayNamespace -}}
{{- $configApiGatewayName := index .Values.global "config-api" "gatewayName" | default $defaultGatewayName -}}
{{- $configApiGatewayNamespace := index .Values.global "config-api" "gatewayNamespace" | default $defaultGatewayNamespace -}}
{{- $fido2GatewayName := .Values.global.fido2.gatewayName | default $defaultGatewayName -}}
{{- $fido2GatewayNamespace := .Values.global.fido2.gatewayNamespace | default $defaultGatewayNamespace -}}
{{- $scimGatewayName := .Values.global.scim.gatewayName | default $defaultGatewayName -}}
{{- $scimGatewayNamespace := .Values.global.scim.gatewayNamespace | default $defaultGatewayNamespace -}}

{{- /* ======================================================== */}}
{{- /* 1. ADMIN UI ROUTES                                       */}}
{{- /* ======================================================== */}}

{{- if .Values.routes.adminUiEnabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-admin-ui-public
  namespace: {{ $namespace }}
  labels:
    app: {{ $fullName }}-routes
{{- if .Values.routes.labels }}
{{- toYaml .Values.routes.labels | nindent 4 }}
{{- end }}
{{- if .Values.routes.annotations }}
  annotations:
{{- toYaml .Values.routes.annotations | nindent 4 }}
{{- end }}
spec:
  parentRefs:
  - name: {{ $adminUiGatewayName }}
    namespace: {{ $adminUiGatewayNamespace }}
  hostnames:
  - {{ .Values.global.fqdn | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /admin
    backendRefs:
    - name: {{ $adminSvc }}
      port: 8080
{{- end }}


{{- /* ======================================================== */}}
{{- /* 2. AUTH SERVER ROUTES                                    */}}
{{- /* ======================================================== */}}

{{- /* Auth Server: Public (HTTP/HTTPS No Redirect) */}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-auth-server-public
  namespace: {{ $namespace }}
  labels:
    app: {{ $fullName }}-routes
{{- if .Values.routes.labels }}
{{- toYaml .Values.routes.labels | nindent 4 }}
{{- end }}
{{- if .Values.routes.annotations }}
  annotations:
{{- toYaml .Values.routes.annotations | nindent 4 }}
{{- end }}
spec:
  parentRefs:
  - name: {{ $authGatewayName }}
    namespace: {{ $authGatewayNamespace }}
  hostnames:
  - {{ .Values.global.fqdn | quote }}
  rules:
  {{- if .Values.routes.openidConfigEnabled }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/openid-configuration
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/.well-known/openid-configuration
    backendRefs:
    - name: {{ $authSvc }}
      port: 8080
  {{- end }}
  {{- if .Values.routes.deviceCodeEnabled }}
  - matches:
    - path:
        type: Exact
        value: /device-code
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/device_authorization.htm
    backendRefs:
    - name: {{ $authSvc }}
      port: 8080
  {{- end }}
  {{- if .Values.routes.firebaseMessagingEnabled }}
  - matches:
    - path:
        type: Exact
        value: /firebase-messaging-sw.js
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/firebase-messaging-sw.js
    backendRefs:
    - name: {{ $authSvc }}
      port: 8080
  {{- end }}
  {{- if .Values.routes.uma2ConfigEnabled }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/uma2-configuration
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/restv1/uma2-configuration
    backendRefs:
    - name: {{ $authSvc }}
      port: 8080
  {{- end }}
  {{- if .Values.routes.webfingerEnabled }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/webfinger
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/.well-known/webfinger
    backendRefs:
    - name: {{ $authSvc }}
      port: 8080
  {{- end }}
  {{- if and (index .Values.global "auth-server" "lockEnabled") (.Values.routes.lockConfigEnabled) }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/lock-server-configuration
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/api/v1/configuration
    backendRefs:
    - name: {{ $authSvc }}
      port: 8080
  {{- end }}
  {{- if .Values.routes.authzenConfigEnabled }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/authzen-configuration
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/restv1/authzen-configuration
    backendRefs:
    - name: {{ $authSvc }}
      port: 8080
  {{- end }}

{{- /* Auth Server: Secure (HTTPS) */}}
{{- if .Values.routes.authServerEnabled }}
---
