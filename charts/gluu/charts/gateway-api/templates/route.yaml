{{- /* Auth Server: Protected HTTPS */}}
{{- if or (.Values.routes.authServerProtectedToken) (.Values.routes.authServerProtectedRegister) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-auth-server-protected
  namespace: {{ $namespace }}
  labels:
    app: {{ $fullName }}-routes
{{- if .Values.routes.labels }}
{{- toYaml .Values.routes.labels | nindent 4 }}
{{- end }}
{{- if .Values.routes.annotations }}
  annotations:
{{- toYaml .Values.routes.annotations | nindent 4 }}
{{- end }}
spec:
  parentRefs:
  - name: {{ $authGatewayName }}
    namespace: {{ $authGatewayNamespace }}
    sectionName: {{ $httpsSection }}
  hostnames:
  - {{ .Values.global.fqdn | quote }}
  rules:
  {{- /* Auth Server protected token (/jans-auth/restv1/token) */}}
  {{- if .Values.routes.authServerProtectedToken }}
  - matches:
    - path:
        type: PathPrefix
        value: /jans-auth/restv1/token
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /restv1/token
    {{- if and (eq .Values.gateway.className "nginx") (.Values.gateway.verifyClientCertProtection) (.Values.additionalConfig.nginx.enableClientCertSnippets) }}
    - type: ExtensionRef
      extensionRef:
        group: gateway.nginx.org
        kind: SnippetsFilter
        name: {{ .Release.Name }}-nginx-verify-client
    {{- end }}
    backendRefs:
    - name: {{ $authSvc }}
      port: 8080
  {{- end }}

  {{- /* Auth Server protected register (/jans-auth/restv1/register) */}}
  {{- if .Values.routes.authServerProtectedRegister }}
  - matches:
    - path:
        type: PathPrefix
        value: /jans-auth/restv1/register
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /restv1/register
    {{- if and (eq .Values.gateway.className "nginx") (.Values.gateway.verifyClientCertProtection) (.Values.additionalConfig.nginx.enableClientCertSnippets) }}
    - type: ExtensionRef
      extensionRef:
        group: gateway.nginx.org
        kind: SnippetsFilter
        name: {{ .Release.Name }}-nginx-verify-client
    {{- end }}
    backendRefs:
    - name: {{ $authSvc }}
      port: 8080
  {{- end }}
{{- end }}


